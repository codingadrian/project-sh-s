---
layout: null
---
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictionary — Boruca (Brúnkajk) Language Project</title>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="boruca-header">
  {% include navbar.html %}
  <nav class="navbar-links boruca-nav">
    <a href="{{ '/pages/boruca/grammar.html' | relative_url }}">Grammar</a>
    <a href="{{ '/pages/boruca/dictionary.html' | relative_url }}" class="active">Dictionary</a>
  </nav>
</div>

<div class="dict-shell">
  <aside class="word-sidebar">
    <div class="word-search-box">
      <input type="search" id="search" placeholder="Search headword or gloss…" autocomplete="off">
      <div class="mini-filters">
        <select id="filter-pos"><option value="">Any part of speech</option></select>
        <select id="filter-morph"><option value="">Any formation</option></select>
        <select id="filter-domain"><option value="">Any domain</option></select>
        <select id="filter-status">
          <option value="">Any review status</option>
          <option value="unreviewed">Unreviewed</option>
          <option value="reviewed">Reviewed</option>
          <option value="deleted">Deleted (locally)</option>
        </select>
      </div>
      <label class="dup-filter">
        <input type="checkbox" id="filter-dup">
        Duplicates only (spelling clashes + exact dupes) <span id="dup-total"></span>
      </label>
      <label class="dup-filter dup-filter-headword">
        <input type="checkbox" id="filter-headword-dup">
        Same headword only (review for merge/polysemy) <span id="headword-dup-total"></span>
      </label>
      <div class="dict-count" id="count"></div>
      <div class="edits-bar" id="edits-bar" hidden>
        <span id="edits-count"></span>
        <button type="button" id="edits-export" class="btn btn-ghost">Export changes</button>
        <button type="button" id="edits-clear" class="btn btn-ghost">Clear all</button>
      </div>
    </div>
    <div class="word-list" id="word-list"></div>
  </aside>

  <main class="entry-panel" id="entry-panel">
    <div class="entry-panel-empty">Select a word from the list, or search, to see its entry.</div>
  </main>
</div>

<script src="assets/vocabulary.js"></script>
<script src="assets/script.js"></script>
</body>
</html>
