title: Chibchan Languages
subtitle: A compact classification of the Chibchan language family

# Canvas is an internal reference coordinate system (not pixels) — index.html
# renders every x/y as a percentage of it, so the whole tree scales to fit
# any viewport with no overflow. Positions are hand-placed to match a
# specific reference layout (not date-proportional — that was tried in an
# earlier pass and dropped when the visual spec changed to a fixed-column
# org-chart look). Node boxes are positioned by their top-left corner.
canvas:
  width: 1200
  height: 710

theme:
  background: "#ffffff"
  connector: "#59595b"
  root: "#1c4587"
  branch: "#f1c232"
  branch_text: "#3c3c3c"
  language: "#ff9900"
  live: "#f1c232"
  panel: "#f6b26b"
  panel_text: "#3c3c3c"

# Two nodes with no documented affiliation/date are drawn disconnected from
# the tree entirely (no connector line), matching the reference exactly —
# not a rendering bug.
orphans:
  - { id: quepo, label: Quepo, status: uncertain, x: 30, y: 50, w: 115, h: 34, href: /pages/quepo.html }
  - { id: paya, label: Paya, x: 30, y: 112, w: 115, h: 34, href: /pages/paya-pech.html }

