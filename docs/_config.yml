title: Project Shá's
description: An experiment in AI-assisted language revival for Bruncájc (Boruca) — Shá's, the documented language, and Trú, a proposed revival
lang: en

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

# Project-page hosting (https://<user>.github.io/<repo>/) needs a baseurl;
# a user page or custom domain should leave this blank. Links in this site
# are written with a leading slash through the relative_url filter (e.g.
# {{ '/assets/css/site.css' | relative_url }}), which prepends this value —
# so it must match the repo name whenever this is hosted as a project page.
baseurl: "/project-sh-s"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
